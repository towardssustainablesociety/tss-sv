# Bygger TSS och publicerar på GitHub Pages vid varje ändring i main.
# Ligger i förrådet som .github/workflows/publicera.yml.
# Skarp publicering sedan 2026-10-28 (förvaltningsplanen, steg 7). Lägg till --noindex för att dölja webbplatsen för sökmotorer igen.
name: Bygg och publicera

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  bygg:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Installera pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc

      - name: Bygg webbplatsen
        env:
          TSS_FORRAD: ${{ github.server_url }}/${{ github.repository }}
        run: |
          python3 bygg/bygg.py texter _site | tee bygglogg.txt
          echo '### Bygget' >> "$GITHUB_STEP_SUMMARY"
          sed 's/^/    /' bygglogg.txt >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  publicera:
    needs: bygg
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
